title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using AI Dev Team Marketplace. Please share enough context for the community to give you a precise, reproducible answer.

        Do not include API keys, access tokens, credentials, private repository content, or other secrets.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What is your question mainly about?
      options:
        - Installation or setup
        - Plugin update or activation
        - Skills
        - Agents
        - Routing or orchestration
        - Testing or Playwright
        - Database migrations
        - Security or DevSecOps
        - Deployment planning or release preparation
        - Other
    validations:
      required: true

  - type: input
    id: claude_code_version
    attributes:
      label: Claude Code version
      description: Run `claude --version` if available.
      placeholder: "e.g. 2.1.251"
    validations:
      required: false

  - type: input
    id: plugin_version
    attributes:
      label: AI Dev Team version
      description: Enter the installed plugin version if known.
      placeholder: "e.g. 0.2.0 or unknown"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question or problem
      description: Describe what you are trying to do and where you are blocked.
      placeholder: "What are you trying to accomplish, and what happened?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps, prompt, or command to reproduce
      description: Include the smallest reproducible sequence when applicable. Redact secrets and private data.
      placeholder: |
        1. Installed the plugin...
        2. Ran /ai-dev-team:...
        3. Asked...
        4. Observed...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What result did you expect?
      placeholder: "I expected the plugin to..."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant output or evidence
      description: Paste concise logs, validation output, screenshots, or repository evidence if useful. Remove secrets first.
      placeholder: "Relevant error/output, if any"
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before posting
      options:
        - label: I searched the README, existing Discussions, and Issues for the same question.
          required: true
        - label: I removed credentials, tokens, private customer data, and other secrets from the information above.
          required: true
