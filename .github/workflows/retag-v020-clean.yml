name: One-time retag v0.2.0 clean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retag-v020-clean.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Retarget v0.2.0 to sanitized release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_SHA: 49d0d1ff726aaadf7fae0ce8f07fa003aa3026f5
          OLD_SHA: ef200d0bc54c1a440826b8f298cdd39f8dceaee0
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.0"
          current="$(python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/tags/v0.2.0",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["object"]["sha"])
          PY
          )"
          echo "Current v0.2.0 tag target: ${current}"

          if [ "${current}" = "${CLEAN_SHA}" ]; then
            echo "Tag already sanitized."
            exit 0
          fi

          if [ "${current}" != "${OLD_SHA}" ]; then
            echo "Unexpected tag target ${current}; refusing to move it." >&2
            exit 1
          fi

          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/refs/tags/v0.2.0"
          payload = json.dumps({"sha": os.environ["CLEAN_SHA"], "force": True}).encode()
          req = urllib.request.Request(
              url,
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as r:
              body = json.load(r)
          actual = body["object"]["sha"]
          expected = os.environ["CLEAN_SHA"]
          if actual != expected:
              raise SystemExit(f"Tag update mismatch: {actual} != {expected}")
          print(f"v0.2.0 retargeted to {actual}")
          PY
